<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="BDL LOGO.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computation Tool</title>


<script src="script.js"></script>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Field Computation Tool</h2>

    <div class="top-inputs">
        <div>
            <label>Pax</label>
            <input type="number" name="pax">
        </div>
        <div>
            <label>Hours</label>
<input type="number" name="hours" value="8" oninput="recomputeAll()">        </div>
    </div>
<button onclick="downloadPDF()" class="btn">Download PDF</button>
    <table>
        <thead>
            <tr>
                <th>Staff</th>
                <th>No.</th>
                <th>Rate</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>

<tr>
    <td class="role-cell">Medical Technologist</td>
    <td><input type="number" id="no_1" oninput="compute(1)"></td>
    <td><input type="number" id="rate_1" oninput="compute(1)"></td>
    <td><input type="number" id="amount_1" readonly></td>
</tr>

<tr>
    <td class="role-cell">Team Leader</td>
    <td><input type="number" id="no_2" oninput="compute(2)"></td>
    <td><input type="number" id="rate_2" oninput="compute(2)"></td>
    <td><input type="number" id="amount_2" readonly></td>
</tr>

<tr>
    <td class="role-cell">Encoder</td>
    <td><input type="number" id="no_3" oninput="compute(3)"></td>
    <td><input type="number" id="rate_3" oninput="compute(3)"></td>
    <td><input type="number" id="amount_3" readonly></td>
</tr>

<tr>
    <td class="role-cell">Radiologic Technologist</td>
    <td><input type="number" id="no_4" oninput="compute(4)"></td>
    <td><input type="number" id="rate_4" oninput="compute(4)"></td>
    <td><input type="number" id="amount_4" readonly></td>
</tr>

<tr>
    <td class="role-cell">ASC</td>
    <td><input type="number" id="no_5" oninput="compute(5)"></td>
    <td><input type="number" id="rate_5" oninput="compute(5)"></td>
    <td><input type="number" id="amount_5" readonly></td>
</tr>

<tr>
    <td class="role-cell">Nurse</td>
    <td><input type="number" id="no_6" oninput="compute(6)"></td>
    <td><input type="number" id="rate_6" oninput="compute(6)"></td>
    <td><input type="number" id="amount_6" readonly></td>
</tr>

<tr>
    <td class="role-cell">Receptionist</td>
    <td><input type="number" id="no_7" oninput="compute(7)"></td>
    <td><input type="number" id="rate_7" oninput="compute(7)"></td>
    <td><input type="number" id="amount_7" readonly></td>
</tr>

<tr>
    <td class="role-cell">Driver</td>
    <td><input type="number" id="no_8" oninput="compute(8)"></td>
    <td><input type="number" id="rate_8" oninput="compute(8)"></td>
    <td><input type="number" id="amount_8" readonly></td>
</tr>

<tr>
    <td class="role-cell">Commission</td>
    <td><input type="number" id="no_9" oninput="compute(9)"></td>
    <td><input type="number" id="rate_9" oninput="compute(9)"></td>
    <td><input type="number" id="amount_9" readonly></td>
</tr>

<tr>
    <td class="role-cell">Gasoline</td>
    <td><input type="number" id="no_10" oninput="compute(10)"></td>
    <td><input type="number" id="rate_10" oninput="compute(10)"></td>
    <td><input type="number" id="amount_10" readonly></td>
</tr>

<tr class="total-row">
    <td colspan="3">TOTAL</td>
    <td><input type="number" id="grand_total" readonly></td>
</tr>

</tbody>

    </table>
</div>

</body>
</html>
